spring:
  datasource:
    url: jdbc:h2:mem:capi_test_db_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  mail:
    host: localhost
    port: 3025
  kafka:
    listener:
      auto-startup: false

app:
  jwt:
    secret: TestSecretKeyForCapiTransactionsDisputePortalJUnitValidation2026!
    expiration-seconds: 3600
  frontend-base-url: http://localhost:4200
  cors:
    allowed-origins: http://localhost:4200
  security:
    trusted-proxies: 10.0.0.0/8
  storage:
    attachments-dir: target/test-attachments
  mail:
    from: security-alerts@capi.test
  kafka:
    enabled: false
  idempotency:
    ttl-seconds: 300

