server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: capi-dispute-portal
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 30MB
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2
    consumer:
      group-id: capi-dispute-portal-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${APP_KAFKA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-seconds: 28800
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    # Comma-separated IPs/CIDRs of trusted reverse proxies allowed to set X-Forwarded-For / X-Real-IP.
    # Empty by default so direct clients cannot spoof audit IP addresses.
    trusted-proxies: ${APP_TRUSTED_PROXIES:}
  storage:
    attachments-dir: ${APP_ATTACHMENTS_DIR:/app/storage/attachments}
  mail:
    from: security-alerts@capi.test
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
  idempotency:
    ttl-seconds: ${APP_IDEMPOTENCY_TTL_SECONDS:300}

